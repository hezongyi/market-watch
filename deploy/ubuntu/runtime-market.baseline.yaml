# Stage 0 only: immutable v1.29.1 code, isolated PG, controlled fixture workloads.
# This is a measurement harness, not the target five-service deployment.
x-limits: &limits
  restart: "no"
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
services:
  postgres:
    <<: *limits
    image: postgres:14.24-bookworm@sha256:993166bee3ea12e2baa70f47efe7ba4a191b3e92f44f9767eaefbb6194f53872
    cpus: 0.75
    mem_limit: 768m
    environment:
      POSTGRES_USER: runtime_baseline
      POSTGRES_DB: runtime_baseline
      POSTGRES_PASSWORD: ${MW_RUNTIME_DATABASE_PASSWORD:?}
    command: [postgres, -c, jit=off, -c, max_connections=40, -c, track_io_timing=on]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U runtime_baseline -d runtime_baseline && test \"$$(PGOPTIONS='-c jit=on' psql -U runtime_baseline -d runtime_baseline -Atqc \"SELECT current_setting('server_version_num') = '140024' AND pg_jit_available()\")\" = t"]
      interval: 3s
      timeout: 5s
      retries: 20
  probe:
    <<: *limits
    image: ${MW_RUNTIME_BASELINE_IMAGE:?}
    cpus: 1.5
    mem_limit: 1536m
    working_dir: /candidate
    env_file: ${MW_RUNTIME_PRIVATE_DIR:?}/backend.env
    environment:
      PYTHONPATH: /candidate/backend:/candidate/backend/tests
      PYTHONDONTWRITEBYTECODE: '1'
      ALERTS_DATABASE_EXPECTED_VERSION: '140024'
      MW_RUNTIME_BASELINE_TASK: mw-runtime-20261026
    volumes:
      - type: bind
        source: ${MW_RUNTIME_REPO:?}
        target: /candidate
        read_only: true
      - type: bind
        source: ${MW_RUNTIME_ARTIFACTS:?}
        target: /artifacts
    depends_on:
      postgres: {condition: service_healthy}
    command: [python, scripts/runtime_market_baseline.py]
volumes:
  postgres-data: {}
networks:
  default: {internal: true}
