resolver 127.0.0.11 valid=5s ipv6=off;
upstream development_frontend {
    zone development_frontend 64k;
    server frontend:5173 resolve;
}
server {
    listen 80;
    server_name _;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/wasm;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    # Keep backend and streaming responses outside frontend compression.
    location ~ ^/(?:api|mcp)(?:/|$) {
        proxy_pass http://development_frontend;
    }
    location / {
        gzip on;
        proxy_pass http://development_frontend;
    }
}
