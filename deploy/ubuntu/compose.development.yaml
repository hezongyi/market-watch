# Persistent Ubuntu development instance. Secrets stay outside this checkout.
name: mw-dev
x-limits: &limits
  restart: unless-stopped
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
x-app: &app
  <<: *limits
  image: ${MW_API_IMAGE:?}
  user: ${MW_APP_UID:?}:${MW_APP_GID:?}
  env_file: ${MW_PRIVATE_DIR:?}/backend.env
  volumes:
    - ${MW_PRIVATE_DIR:?}/fxcm:/opt/market-watch/fxcm:ro
  depends_on:
    migrate: {condition: service_completed_successfully}
  mem_limit: 1536m
  cpus: 1.5
services:
  postgres:
    <<: *limits
    image: postgres:14.24-bookworm@sha256:993166bee3ea12e2baa70f47efe7ba4a191b3e92f44f9767eaefbb6194f53872
    env_file: ${MW_PRIVATE_DIR:?}/postgres.env
    command: [postgres, -c, shared_buffers=256MB, -c, max_connections=80, -c, jit=off]
    volumes: [postgres-data:/var/lib/postgresql/data]
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dev -d dev && test \"$$(PGOPTIONS='-c jit=on' psql -U dev -d dev -Atqc \"SELECT current_setting('server_version_num') = '140024' AND pg_jit_available()\")\" = t"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *app
    restart: 'no'
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  market-runtime:
    <<: *app
    command: [python, -m, alerts.runtime, --profile, market]
    environment:
      ALERTS_DATABASE_APPLICATION_NAME: mw-dev-market
      ALERTS_DATABASE_POOL_SIZE: '6'
      ALERTS_MARKET_RUNTIME_CHART_ALERT_ENABLED: 'true'
      ALERTS_DELIVERY_ENABLED: 'false'
  data-worker:
    <<: *app
    command: [python, -m, alerts.runtime, --profile, data]
    mem_limit: 2560m
    cpus: 2
    environment:
      ALERTS_DATABASE_APPLICATION_NAME: mw-dev-data
      ALERTS_DATABASE_POOL_SIZE: '16'
      ALERTS_DELIVERY_ENABLED: 'false'
  notification-worker:
    <<: *app
    command: [python, -m, alerts.runtime, --profile, notifications]
    mem_limit: 768m
    cpus: 0.5
    environment:
      ALERTS_DATABASE_APPLICATION_NAME: mw-dev-notifications
      ALERTS_DATABASE_POOL_SIZE: '4'
  web:
    <<: *limits
    image: ${MW_WEB_IMAGE:?}
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      api: {condition: service_healthy}
  tls:
    <<: *limits
    image: nginx:1.28-alpine@sha256:201aafcbd9cdd5385d5aaf610b45389944d8c2269c4a6f10e6fdf39f76cab592
    mem_limit: 96m
    cpus: 0.25
    ports:
      - '${MW_BIND_ADDRESS:?}:${MW_HTTPS_PORT:?}:443'
      - '${MW_BIND_ADDRESS:?}:${MW_NTFY_PORT:?}:8443'
    volumes:
      - ./development-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MW_PRIVATE_DIR:?}/tls:/certs:ro
    depends_on: [web, ntfy]
  ntfy:
    <<: *limits
    image: ${MW_NTFY_IMAGE:?}
    user: ${MW_APP_UID:?}:${MW_APP_GID:?}
    mem_limit: 256m
    cpus: 0.25
    volumes:
      - ${MW_PRIVATE_DIR:?}/ntfy-cache:/var/cache/ntfy
    environment:
      NTFY_BASE_URL: https://${MW_BIND_ADDRESS:?}:${MW_NTFY_PORT:?}
      NTFY_ENABLE_LOGIN: 'false'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres-data: {}
