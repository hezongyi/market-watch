# Ubuntu-only, task-owned image and independent PostgreSQL. No production credentials.
services:
  postgres:
    image: postgres:14.24-bookworm@sha256:993166bee3ea12e2baa70f47efe7ba4a191b3e92f44f9767eaefbb6194f53872
    restart: "no"
    environment:
      POSTGRES_DB: provider_fix
      POSTGRES_USER: provider_fix
      POSTGRES_PASSWORD: ${MW_ACCEPTANCE_DB_PASSWORD:?Set a development-only password}
    ports: ["127.0.0.1:19815:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && test \"$$(PGOPTIONS='-c jit=on' psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atqc \"SELECT current_setting('server_version_num') = '140024' AND pg_jit_available()\")\" = t"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: ${MW_API_IMAGE:?Build with mw-docker}
    restart: "no"
    command: [alembic, upgrade, head]
    environment: &backend-env
      ALERTS_DATABASE_URL: postgresql+psycopg://provider_fix:${MW_ACCEPTANCE_DB_PASSWORD}@postgres/provider_fix
      ALERTS_DATABASE_EXPECTED_VERSION: "140024"
      ALERTS_COOKIE_SECURE: "false"
      ALERTS_ADMIN_PASSWORD_HASH: ${MW_BACKEND_LOGIN_HASH:?Set an acceptance-only login hash}
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_MCP_ENABLED: "false"
      ALERTS_YAHOO_ENABLED: "false"
      ALERTS_INITIAL_HISTORY_DAYS: "0"
      ALERTS_BINANCE_CONNECTION_MODE: direct
      ALERTS_OANDA_STREAM_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    image: ${MW_API_IMAGE:?Build with mw-docker}
    restart: "no"
    environment: *backend-env
    ports: ["192.168.7.232:19816:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 20
  verify:
    image: ${MW_API_IMAGE:?Build with mw-docker}
    restart: "no"
    profiles: [verification]
    environment:
      <<: *backend-env
      TEST_POSTGRES_URL: postgresql+psycopg://provider_fix:${MW_ACCEPTANCE_DB_PASSWORD}@postgres/provider_fix
      ALERTS_DATABASE_EXPECTED_VERSION: "140024"
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres-data:
