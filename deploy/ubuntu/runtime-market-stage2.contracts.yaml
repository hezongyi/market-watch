# Stage 2 PostgreSQL contracts; task-owned internal network and tmpfs database.
services:
  postgres:
    image: postgres:14.24-bookworm@sha256:993166bee3ea12e2baa70f47efe7ba4a191b3e92f44f9767eaefbb6194f53872
    labels: {market-watch.task: runtime-market-stage2-20261027}
    cpus: 0.75
    mem_limit: ${MW_RUNTIME_STAGE2_POSTGRES_MEMORY:-768m}
    environment:
      POSTGRES_DB: runtime_stage2
      POSTGRES_USER: runtime_stage2
      POSTGRES_HOST_AUTH_METHOD: trust
    command: [postgres, -c, jit=off, -c, max_connections=40]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U runtime_stage2 -d runtime_stage2 && test \"$$(PGOPTIONS='-c jit=on' psql -U runtime_stage2 -d runtime_stage2 -Atqc \"SELECT current_setting('server_version_num') = '140024' AND pg_jit_available()\")\" = t"]
      interval: 2s
      timeout: 3s
      retries: 30
  contracts:
    image: sha256:995534fb1c8238b5a71f2155017bafe439000c6f0cb78708f17471d2c6542743
    labels: {market-watch.task: runtime-market-stage2-20261027}
    cpus: 1
    mem_limit: 1024m
    working_dir: /candidate
    volumes: ['${MW_RUNTIME_STAGE2_REPO:?}:/candidate:ro']
    environment:
      PYTHONPATH: /candidate/backend:/candidate/backend/tests
      PYTHONDONTWRITEBYTECODE: '1'
      TEST_POSTGRES_URL: postgresql+psycopg://runtime_stage2@postgres/runtime_stage2
      CHART_ALERT_TEST_DATABASE_URL: postgresql+psycopg://runtime_stage2@postgres/runtime_stage2
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: [python, -m, pytest, -q, -p, 'no:cacheprovider']
    command:
      - backend/tests/test_market_runtime_postgres.py
      - backend/tests/test_chart_alert_postgres.py
      - backend/tests/test_composite_alerts_postgres.py
      - backend/tests/test_composite_aggregates_postgres.py
      - backend/tests/test_composite_revisions_postgres.py
      - backend/tests/test_oanda_recovery_postgres.py
      - backend/tests/test_realtime_switch_postgres.py
  load:
    extends: {service: contracts}
    # The stage-0 owner processes shared this exact total cgroup budget.
    cpus: 1.5
    mem_limit: 1536m
    volumes: ['${MW_RUNTIME_STAGE2_ARTIFACTS:-/home/quant/.local/share/market-watch-runtime-stage2-20261027/artifacts}:/artifacts']
    environment:
      ALERTS_DATABASE_URL: postgresql+psycopg://runtime_stage2@postgres/runtime_stage2
      MW_RUNTIME_BASELINE_TASK: mw-runtime-stage2-20261027
      ALERTS_DELIVERY_ENABLED: 'false'
      ALERTS_OANDA_STREAM_ENABLED: 'false'
      ALERTS_YAHOO_ENABLED: 'false'
    entrypoint: [python, /candidate/scripts/runtime_market_baseline.py]
    command: [--scenario, all, --profile-runtime, --independent-alert]
networks:
  default: {internal: true}
