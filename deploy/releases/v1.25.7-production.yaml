        condition: service_healthy
  history-worker:
    image: sha256:84e794d3321543bf8a073e537cbdc5c614b2af1d518f402a0955585ccedb5cb4
    env_file: .env
    environment:
      ALERTS_YAHOO_ENABLED: 'true'
      ALERTS_DELIVERY_ENABLED: 'false'
      ALERTS_DATABASE_POOL_SIZE: '2'
      ALERTS_DATABASE_MAX_OVERFLOW: '0'
      ALERTS_DATABASE_JIT: 'off'
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-history-versions
      ALERTS_OANDA_ACQUISITION_MODE: stream
      ALERTS_OANDA_REST_INTERVAL_SECONDS: '2'
    restart: unless-stopped
    command:
    - python
    - -m
    - alerts.history_versions
    - --without-composite-aggregates
    depends_on:
      api:
        condition: service_healthy
  composite-aggregate-worker:
    image: sha256:84e794d3321543bf8a073e537cbdc5c614b2af1d518f402a0955585ccedb5cb4
    env_file: .env
    environment:
      ALERTS_YAHOO_ENABLED: 'true'
