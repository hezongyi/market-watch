    - 192.168.7.33:18080:80
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  chart-origin:
    image: sha256:4b28398bdd0fe989464f9f90a26d9c8b45ea2ced53bc7daaeb7ee867e83d0683
