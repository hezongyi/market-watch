server {
 listen 443 ssl;
 server_name 192.168.7.232 v132.localhost localhost;
 ssl_certificate /certs/cert.pem;
 ssl_certificate_key /certs/key.pem;
 # Browsers scope cookies by hostname, not port. Only the parent API needs
 # the session; keep it off chart asset paths on the other origin.
 proxy_cookie_path / /api;
 # Remove cookies issued with the old root path during the transition.
 add_header Set-Cookie "session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict" always;
 # nginx uses 497 for plain HTTP sent to an SSL listener. Preserve the
 # external port, path and query instead of showing its generic 400 page.
 error_page 497 =308 https://$host:15653$request_uri;
 location = /api/charts/provider/events {
  proxy_pass http://web:80;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_buffering off;
  proxy_read_timeout 3600s;
 }
 location / {
  proxy_pass http://web:80;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
 }
}
server {
 listen 444 ssl;
 server_name 192.168.7.232 localhost;
 ssl_certificate /certs/cert.pem;
 ssl_certificate_key /certs/key.pem;
 error_page 497 =308 https://192.168.7.232:15654$request_uri;
 # The chart origin has no authenticated API. Never forward browser
 # credentials to the licensed chart host, even for manually issued requests.
 location /api { return 404; }
 location / {
  proxy_pass http://chart-origin:80;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $http_host;
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
 }
}
