server {
 listen 443 ssl;
 server_name 192.168.7.232 v132.localhost localhost;
 ssl_certificate /certs/cert.pem;
 ssl_certificate_key /certs/key.pem;
 # nginx uses 497 for plain HTTP sent to an SSL listener. Preserve the
 # external port, path and query instead of showing its generic 400 page.
 error_page 497 =308 https://$host:15653$request_uri;
 location = /api/charts/provider/events {
  proxy_pass http://web:80;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_buffering off;
  proxy_read_timeout 3600s;
 }
 location / {
  proxy_pass http://web:80;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
 }
}
server {
 listen 444 ssl;
 server_name chart-v132.192.168.7.232.sslip.io;
 ssl_certificate /certs/cert.pem;
 ssl_certificate_key /certs/key.pem;
 error_page 497 =308 https://chart-v132.192.168.7.232.sslip.io:15654$request_uri;
 # Keep the chart on its own hostname, including when the LAN IP is typed.
 if ($host != chart-v132.192.168.7.232.sslip.io) {
  return 308 https://chart-v132.192.168.7.232.sslip.io:15654$request_uri;
 }
 location / {
  proxy_pass http://chart-origin:80;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $http_host;
 }
}
