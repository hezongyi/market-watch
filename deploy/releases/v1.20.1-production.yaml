# Standalone production release template. Pin immutable image references in the release env.
# Yahoo stays enabled across image upgrades; no extra overlay is required.
name: market-watch
x-app: &app
  image: sha256:7f0617c63f25f0578b5f5408e6680196f78f653401f1a188852366f0bbeee86e
  env_file: .env
  environment:
    ALERTS_YAHOO_ENABLED: "true"
    ALERTS_DATABASE_POOL_SIZE: "2"
    ALERTS_DATABASE_MAX_OVERFLOW: "0"
  restart: unless-stopped
services:
  migrate:
    image: sha256:7f0617c63f25f0578b5f5408e6680196f78f653401f1a188852366f0bbeee86e
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
  api:
    <<: *app
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_COOKIE_SECURE: "true"
      ALERTS_OANDA_STREAM_ENABLED: "true"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-api
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  realtime-worker:
    <<: *app
    command: ["python", "-m", "alerts.realtime_worker"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-realtime
    depends_on:
      api: {condition: service_healthy}
  chart-history-worker:
    <<: *app
    command: ["python", "-m", "alerts.chart_history_worker"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-history
    depends_on:
      api: {condition: service_healthy}
  chart-aggregation-worker:
    <<: *app
    command: ["python", "-m", "alerts.chart_aggregation_worker"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-aggregation
    depends_on:
      api: {condition: service_healthy}
  native-history-worker:
    <<: *app
    command: ["python", "-m", "alerts.native_history_loads"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-native-history
    depends_on:
      api: {condition: service_healthy}
  history-worker:
    <<: *app
    command: ["python", "-m", "alerts.history_versions", "--without-composite-aggregates"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-history-versions
    depends_on:
      api: {condition: service_healthy}
  composite-aggregate-worker:
    <<: *app
    command: ["python", "-m", "alerts.composite_aggregate_worker"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-composite
    depends_on:
      api: {condition: service_healthy}
  pricing-worker:
    <<: *app
    command: ["python", "-m", "alerts.oanda_worker"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_OANDA_STREAM_ENABLED: "true"
      ALERTS_OANDA_RESIDENT_SYMBOLS: "EUR_USD,XAU_USD"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-pricing
    depends_on:
      api: {condition: service_healthy}
  market-stream-worker:
    <<: *app
    command: ["python", "-m", "alerts.market_stream_worker"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-stream
    depends_on:
      api: {condition: service_healthy}
  notify-worker:
    <<: *app
    command: ["python", "-m", "alerts.notify"]
    depends_on:
      api: {condition: service_healthy}
  web:
    image: sha256:9e917fdddc55a39f963d90e425465e46fca0edb14381e9f71567d1c8782a43f9
    ports: ["192.168.7.33:18080:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  chart-origin:
    image: sha256:ebfcf8df5da880a3ea1a3ee7e9805b2b064ec1bfc815494c06be8578f2c59791
    ports: ["192.168.7.33:18083:80"]
    restart: unless-stopped
  backup:
    image: sha256:d5a880818dce8b6c4adf61ed7feb52781e101e8bb428bdf576351d3948cae55f
    env_file: .env
    environment:
      ALERTS_POSTGRES_BIN_DIR: /usr/local/bin
      ALERTS_DELIVERY_ENABLED: "false"
    volumes: ["/mnt/user/backup/market-watch:/backups"]
    profiles: [maintenance]
    restart: "no"
