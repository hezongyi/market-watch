name: market-watch
x-app:
  image: sha256:b45054a7529265bd8031b2cf7662eea7ec3f7a414bd11e9316f54a4d623dc40f
  env_file: .env
  environment: &id001
    ALERTS_YAHOO_ENABLED: 'true'
    ALERTS_DATABASE_POOL_SIZE: '2'
    ALERTS_DATABASE_MAX_OVERFLOW: '0'
  restart: unless-stopped
services:
  migrate:
    image: sha256:b45054a7529265bd8031b2cf7662eea7ec3f7a414bd11e9316f54a4d623dc40f
    env_file: .env
    environment: *id001
    restart: 'no'
    command:
    - alembic
    - upgrade
    - head
  api:
    image: sha256:b45054a7529265bd8031b2cf7662eea7ec3f7a414bd11e9316f54a4d623dc40f
    env_file: .env
    environment:
      ALERTS_YAHOO_ENABLED: 'true'
      ALERTS_COOKIE_SECURE: 'true'
      ALERTS_OANDA_STREAM_ENABLED: 'true'
      ALERTS_DATABASE_POOL_SIZE: '2'
      ALERTS_DATABASE_MAX_OVERFLOW: '0'
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-api
      ALERTS_HISTORY_HEALTH_WORKERS: '["history_versions","chart_history","native_history"]'
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',
        timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  realtime-worker:
    image: sha256:b45054a7529265bd8031b2cf7662eea7ec3f7a414bd11e9316f54a4d623dc40f
    env_file: .env
    environment:
      ALERTS_YAHOO_ENABLED: 'true'
      ALERTS_DELIVERY_ENABLED: 'false'
      ALERTS_DATABASE_POOL_SIZE: '2'
      ALERTS_DATABASE_MAX_OVERFLOW: '0'
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-realtime
    restart: unless-stopped
    command:
    - python
    - -m
    - alerts.realtime_worker
    depends_on:
      api:
        condition: service_healthy
  chart-history-worker:
    image: sha256:b45054a7529265bd8031b2cf7662eea7ec3f7a414bd11e9316f54a4d623dc40f
    env_file: .env
    environment:
      ALERTS_YAHOO_ENABLED: 'true'
      ALERTS_DELIVERY_ENABLED: 'false'
      ALERTS_DATABASE_POOL_SIZE: '2'
      ALERTS_DATABASE_MAX_OVERFLOW: '0'
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-history
    restart: unless-stopped
    command:
    - python
    - -m
    - alerts.chart_history_worker
    depends_on:
      api:
        condition: service_healthy
  chart-aggregation-worker:
    image: sha256:b45054a7529265bd8031b2cf7662eea7ec3f7a414bd11e9316f54a4d623dc40f
    env_file: .env
    environment:
      ALERTS_YAHOO_ENABLED: 'true'
      ALERTS_DELIVERY_ENABLED: 'false'
      ALERTS_DATABASE_POOL_SIZE: '2'
      ALERTS_DATABASE_MAX_OVERFLOW: '0'
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-aggregation
    restart: unless-stopped
    command:
    - python
    - -m
    - alerts.chart_aggregation_worker
    depends_on:
      api:
        condition: service_healthy
  native-history-worker:
    image: sha256:b45054a7529265bd8031b2cf7662eea7ec3f7a414bd11e9316f54a4d623dc40f
    env_file: .env
    environment:
      ALERTS_YAHOO_ENABLED: 'true'
      ALERTS_DELIVERY_ENABLED: 'false'
      ALERTS_DATABASE_POOL_SIZE: '2'
      ALERTS_DATABASE_MAX_OVERFLOW: '0'
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-native-history
      ALERTS_OANDA_STREAM_ENABLED: 'true'
    restart: unless-stopped
    command:
    - python
    - -m
    - alerts.native_history_loads
    depends_on:
      api:
        condition: service_healthy
  history-worker:
    image: sha256:b45054a7529265bd8031b2cf7662eea7ec3f7a414bd11e9316f54a4d623dc40f
    env_file: .env
    environment:
      ALERTS_YAHOO_ENABLED: 'true'
      ALERTS_DELIVERY_ENABLED: 'false'
      ALERTS_DATABASE_POOL_SIZE: '2'
      ALERTS_DATABASE_MAX_OVERFLOW: '0'
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-history-versions
    restart: unless-stopped
    command:
    - python
    - -m
    - alerts.history_versions
    - --without-composite-aggregates
    depends_on:
      api:
        condition: service_healthy
  composite-aggregate-worker:
    image: sha256:b45054a7529265bd8031b2cf7662eea7ec3f7a414bd11e9316f54a4d623dc40f
    env_file: .env
    environment:
      ALERTS_YAHOO_ENABLED: 'true'
      ALERTS_DELIVERY_ENABLED: 'false'
      ALERTS_DATABASE_POOL_SIZE: '2'
      ALERTS_DATABASE_MAX_OVERFLOW: '0'
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-composite
    restart: unless-stopped
    command:
    - python
    - -m
    - alerts.composite_aggregate_worker
    depends_on:
      api:
        condition: service_healthy
  pricing-worker:
    image: sha256:b45054a7529265bd8031b2cf7662eea7ec3f7a414bd11e9316f54a4d623dc40f
    env_file: .env
    environment:
      ALERTS_YAHOO_ENABLED: 'true'
      ALERTS_DELIVERY_ENABLED: 'false'
      ALERTS_OANDA_STREAM_ENABLED: 'true'
      ALERTS_OANDA_RESIDENT_SYMBOLS: EUR_USD,XAU_USD
      ALERTS_DATABASE_POOL_SIZE: '2'
      ALERTS_DATABASE_MAX_OVERFLOW: '0'
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-pricing
    restart: unless-stopped
    command:
    - python
    - -m
    - alerts.oanda_worker
    depends_on:
      api:
        condition: service_healthy
  market-stream-worker:
    image: sha256:b45054a7529265bd8031b2cf7662eea7ec3f7a414bd11e9316f54a4d623dc40f
    env_file: .env
    environment:
      ALERTS_YAHOO_ENABLED: 'true'
      ALERTS_DELIVERY_ENABLED: 'false'
      ALERTS_DATABASE_POOL_SIZE: '2'
      ALERTS_DATABASE_MAX_OVERFLOW: '0'
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-stream
    restart: unless-stopped
    command:
    - python
    - -m
    - alerts.market_stream_worker
    depends_on:
      api:
        condition: service_healthy
  notify-worker:
    image: sha256:b45054a7529265bd8031b2cf7662eea7ec3f7a414bd11e9316f54a4d623dc40f
    env_file: .env
    environment: *id001
    restart: unless-stopped
    command:
    - python
    - -m
    - alerts.notify
    depends_on:
      api:
        condition: service_healthy
  web:
    image: sha256:f126bda9f63dd397bffd7a7da78364f5aeae124cb9ee3573db8f2bea5dc68050
    ports:
    - 192.168.7.33:18080:80
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  chart-origin:
    image: sha256:5744fde8b28529aa4e5558b92934c5bfaca133c65fcb8e034b692034b8fdc444
    ports:
    - 192.168.7.33:18083:80
    restart: unless-stopped
  backup:
    image: sha256:a623841914cba2b3dd04596cd1bc8f087886a28622cc34292105a717d5f8d009
    env_file: .env
    environment:
      ALERTS_POSTGRES_BIN_DIR: /usr/local/bin
      ALERTS_DELIVERY_ENABLED: 'false'
    volumes:
    - /mnt/user/backup/market-watch:/backups
    profiles:
    - maintenance
    restart: 'no'
