# v1.8.0 production bundle; expand MARKET_WATCH_IMAGE_SUFFIX to the verified immutable build suffix.
name: trading-alerts
x-app: &app
  image: trading-alerts-api:${MARKET_WATCH_IMAGE_SUFFIX:?Set the verified v1.8.0 build suffix}
  env_file: .env
  environment:
    ALERTS_DATABASE_POOL_SIZE: "2"
    ALERTS_DATABASE_MAX_OVERFLOW: "0"
  restart: unless-stopped
services:
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
  api:
    <<: *app
    environment:
      ALERTS_COOKIE_SECURE: "true"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-api
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  realtime-worker:
    <<: *app
    command: ["python", "-m", "alerts.realtime_worker"]
    environment:
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-realtime
    depends_on:
      api: {condition: service_healthy}
  chart-history-worker:
    <<: *app
    command: ["python", "-m", "alerts.chart_history_worker"]
    environment:
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-history
    depends_on:
      api: {condition: service_healthy}
  chart-aggregation-worker:
    <<: *app
    command: ["python", "-m", "alerts.chart_aggregation_worker"]
    environment:
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-aggregation
    depends_on:
      api: {condition: service_healthy}
  native-history-worker:
    <<: *app
    command: ["python", "-m", "alerts.native_history_loads"]
    environment:
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-native-history
    depends_on:
      api: {condition: service_healthy}
  notify-worker:
    <<: *app
    command: ["python", "-m", "alerts.notify"]
    depends_on:
      api: {condition: service_healthy}
  web:
    image: trading-alerts-web:${MARKET_WATCH_IMAGE_SUFFIX:?Set the verified v1.8.0 build suffix}
    ports: ["192.168.7.33:18080:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  chart-origin:
    image: trading-alerts-chart-origin:${MARKET_WATCH_IMAGE_SUFFIX:?Set the verified v1.8.0 build suffix}
    ports: ["192.168.7.33:18083:80"]
    restart: unless-stopped
  backup:
    image: trading-alerts-backup:${MARKET_WATCH_IMAGE_SUFFIX:?Set the verified v1.8.0 build suffix}
    env_file: .env
    environment:
      ALERTS_POSTGRES_BIN_DIR: /usr/local/bin
      ALERTS_DELIVERY_ENABLED: "false"
    volumes: ["/mnt/user/backup/trading-alerts:/backups"]
    profiles: [maintenance]
    restart: "no"
