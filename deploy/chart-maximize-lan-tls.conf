# This gateway belongs only to the isolated Ubuntu acceptance instance.
server {
  listen 443 ssl;
  ssl_certificate /certs/cert.pem;
  ssl_certificate_key /certs/key.pem;
  proxy_cookie_path / /api;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_buffering off;
  proxy_read_timeout 3600s;
  location ~ ^/api/(login|logout)$ {
    # Remove older sessions with Path=/ when logging in or out. The proxied
    # session cookie uses Path=/api and remains available to all application APIs.
    add_header Set-Cookie "session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Strict" always;
    proxy_pass http://web:80;
  }
  location / { proxy_pass http://web:80; }
}
server {
  listen 444 ssl;
  ssl_certificate /certs/cert.pem;
  ssl_certificate_key /certs/key.pem;
  location = /api { return 404; }
  location ^~ /api/ { return 404; }
  location / {
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-CSRF-Token "";
    proxy_pass http://chart-origin:80;
  }
}
