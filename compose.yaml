# Local PG14 baseline uses a new volume; existing PG17 postgres-data is never reused.
name: trading-alerts
services:
  postgres:
    image: postgres:14.24-bookworm@sha256:993166bee3ea12e2baa70f47efe7ba4a191b3e92f44f9767eaefbb6194f53872
    environment:
      POSTGRES_DB: alerts
      POSTGRES_USER: alerts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres14-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && test \"$$(PGOPTIONS='-c jit=on' psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atqc \"SELECT current_setting('server_version_num') = '140024' AND pg_jit_available()\")\" = t"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      ALERTS_DATABASE_URL: postgresql+psycopg://alerts:${POSTGRES_PASSWORD}@postgres/alerts
      ALERTS_DATABASE_EXPECTED_VERSION: "140024"
      ALERTS_OANDA_NATIVE_LATEST_OWNER: "provider"
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    environment:
      ALERTS_DATABASE_URL: postgresql+psycopg://alerts:${POSTGRES_PASSWORD}@postgres/alerts
      ALERTS_DATABASE_EXPECTED_VERSION: "140024"
      ALERTS_OANDA_NATIVE_LATEST_OWNER: "provider"
      ALERTS_COOKIE_SECURE: "true"
      ALERTS_HISTORY_HEALTH_WORKERS: '["history_versions","chart_history","native_history"]'
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  market-runtime:
    build: .
    command: ["python", "-m", "alerts.runtime", "--profile", "market"]
    env_file: .env
    environment:
      ALERTS_DATABASE_URL: postgresql+psycopg://alerts:${POSTGRES_PASSWORD}@postgres/alerts
      ALERTS_DATABASE_EXPECTED_VERSION: "140024"
      ALERTS_OANDA_NATIVE_LATEST_OWNER: "provider"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-market-runtime
      ALERTS_MARKET_RUNTIME_CHART_ALERT_ENABLED: 'true'
      # Two ownership sessions; remaining connections shared by runtime work.
      ALERTS_DATABASE_POOL_SIZE: "6"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  data-worker:
    build: .
    command: ["python", "-m", "alerts.runtime", "--profile", "data"]
    env_file: .env
    environment:
      ALERTS_DATABASE_URL: postgresql+psycopg://alerts:${POSTGRES_PASSWORD}@postgres/alerts
      ALERTS_DATABASE_EXPECTED_VERSION: "140024"
      ALERTS_OANDA_NATIVE_LATEST_OWNER: "provider"
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-data-worker
      ALERTS_DATABASE_POOL_SIZE: "16"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  notify-worker:
    build: .
    command: ["python", "-m", "alerts.notify"]
    env_file: .env
    environment:
      ALERTS_DATABASE_URL: postgresql+psycopg://alerts:${POSTGRES_PASSWORD}@postgres/alerts
      ALERTS_DATABASE_EXPECTED_VERSION: "140024"
      ALERTS_OANDA_NATIVE_LATEST_OWNER: "provider"
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  notification-projector:
    build: .
    command: ["python", "-m", "alerts.notification_center_worker"]
    env_file: .env
    environment:
      ALERTS_DATABASE_URL: postgresql+psycopg://alerts:${POSTGRES_PASSWORD}@postgres/alerts
      ALERTS_DATABASE_EXPECTED_VERSION: "140024"
      ALERTS_OANDA_NATIVE_LATEST_OWNER: "provider"
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: web/Dockerfile}
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres14-data:
