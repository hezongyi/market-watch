# Standalone production release template. Pin immutable image references in the release env.
# Yahoo stays enabled across image upgrades; no extra overlay is required.
name: market-watch
x-app: &app
  image: ${MW_API_IMAGE:?Set the immutable api release image}
  env_file: .env
  environment: &app-environment
    ALERTS_YAHOO_ENABLED: "true"
    # Keep the release template reversible; switching to REST is an explicit
    # deployment decision and must be applied consistently to API and both
    # workers.  The repository default remains stream until the full gate is
    # accepted.
    ALERTS_OANDA_ACQUISITION_MODE: ${ALERTS_OANDA_ACQUISITION_MODE:-stream}
    ALERTS_OANDA_REST_INTERVAL_SECONDS: ${ALERTS_OANDA_REST_INTERVAL_SECONDS:-2}
    ALERTS_DATABASE_POOL_SIZE: "2"
    ALERTS_DATABASE_MAX_OVERFLOW: "0"
    ALERTS_DATABASE_JIT: ${MW_PRODUCTION_DATABASE_JIT:-off}
  restart: unless-stopped
services:
  migrate:
    image: ${MW_API_IMAGE:?Set the immutable api release image}
    <<: *app
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-environment
      ALERTS_DATABASE_JIT: ${MW_MIGRATE_DATABASE_JIT:-${MW_PRODUCTION_DATABASE_JIT:-off}}
    restart: "no"
  api:
    <<: *app
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_COOKIE_SECURE: "true"
      ALERTS_OANDA_ACQUISITION_MODE: ${ALERTS_OANDA_ACQUISITION_MODE:-stream}
      ALERTS_OANDA_REST_INTERVAL_SECONDS: ${ALERTS_OANDA_REST_INTERVAL_SECONDS:-2}
      ALERTS_OANDA_STREAM_ENABLED: "true"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_JIT: ${MW_API_DATABASE_JIT:-${MW_PRODUCTION_DATABASE_JIT:-off}}
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-api
      ALERTS_HISTORY_HEALTH_WORKERS: '["history_versions","chart_history","native_history"]'
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  realtime-worker:
    <<: *app
    command: ["python", "-m", "alerts.realtime_worker"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_OANDA_ACQUISITION_MODE: ${ALERTS_OANDA_ACQUISITION_MODE:-stream}
      ALERTS_OANDA_REST_INTERVAL_SECONDS: ${ALERTS_OANDA_REST_INTERVAL_SECONDS:-2}
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_JIT: ${MW_REALTIME_WORKER_DATABASE_JIT:-${MW_PRODUCTION_DATABASE_JIT:-off}}
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-realtime
    depends_on:
      api: {condition: service_healthy}
  chart-history-worker:
    <<: *app
    command: ["python", "-m", "alerts.chart_history_worker"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_JIT: ${MW_CHART_HISTORY_WORKER_DATABASE_JIT:-${MW_PRODUCTION_DATABASE_JIT:-off}}
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-history
    depends_on:
      api: {condition: service_healthy}
  chart-aggregation-worker:
    <<: *app
    command: ["python", "-m", "alerts.chart_aggregation_worker"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_JIT: ${MW_CHART_AGGREGATION_WORKER_DATABASE_JIT:-${MW_PRODUCTION_DATABASE_JIT:-off}}
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-aggregation
    depends_on:
      api: {condition: service_healthy}
  native-history-worker:
    <<: *app
    command: ["python", "-m", "alerts.native_history_loads"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_JIT: ${MW_NATIVE_HISTORY_WORKER_DATABASE_JIT:-${MW_PRODUCTION_DATABASE_JIT:-off}}
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-native-history
    depends_on:
      api: {condition: service_healthy}
  history-worker:
    <<: *app
    command: ["python", "-m", "alerts.history_versions", "--without-composite-aggregates"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_JIT: ${MW_HISTORY_WORKER_DATABASE_JIT:-${MW_PRODUCTION_DATABASE_JIT:-off}}
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-history-versions
    depends_on:
      api: {condition: service_healthy}
  composite-aggregate-worker:
    <<: *app
    command: ["python", "-m", "alerts.composite_aggregate_worker"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_JIT: ${MW_COMPOSITE_AGGREGATE_WORKER_DATABASE_JIT:-${MW_PRODUCTION_DATABASE_JIT:-off}}
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-composite
    depends_on:
      api: {condition: service_healthy}
  pricing-worker:
    <<: *app
    command: ["python", "-m", "alerts.oanda_worker"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_OANDA_ACQUISITION_MODE: ${ALERTS_OANDA_ACQUISITION_MODE:-stream}
      ALERTS_OANDA_REST_INTERVAL_SECONDS: ${ALERTS_OANDA_REST_INTERVAL_SECONDS:-2}
      ALERTS_OANDA_STREAM_ENABLED: "true"
      ALERTS_OANDA_RESIDENT_SYMBOLS: "EUR_USD,XAU_USD"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_JIT: ${MW_PRICING_WORKER_DATABASE_JIT:-${MW_PRODUCTION_DATABASE_JIT:-off}}
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-pricing
    depends_on:
      api: {condition: service_healthy}
  market-stream-worker:
    <<: *app
    command: ["python", "-m", "alerts.market_stream_worker"]
    environment:
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_DATABASE_POOL_SIZE: "2"
      ALERTS_DATABASE_MAX_OVERFLOW: "0"
      ALERTS_DATABASE_JIT: ${MW_MARKET_STREAM_WORKER_DATABASE_JIT:-${MW_PRODUCTION_DATABASE_JIT:-off}}
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-stream
    depends_on:
      api: {condition: service_healthy}
  notification-worker:
    <<: *app
    command: ["python", "-m", "alerts.notification_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "alerts.notification_worker", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      <<: *app-environment
      ALERTS_DATABASE_JIT: ${MW_NOTIFICATION_WORKER_DATABASE_JIT:-${MW_PRODUCTION_DATABASE_JIT:-off}}
      ALERTS_DATABASE_APPLICATION_NAME: market-watch-production-notifications
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  notify-worker:
    <<: *app
    command: ["python", "-m", "alerts.notify"]
    environment:
      <<: *app-environment
      ALERTS_DATABASE_JIT: ${MW_NOTIFY_WORKER_DATABASE_JIT:-${MW_PRODUCTION_DATABASE_JIT:-off}}
    depends_on:
      api: {condition: service_healthy}
  web:
    image: ${MW_WEB_IMAGE:?Set the immutable web release image}
    ports: ["192.168.7.33:18080:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  chart-origin:
    image: ${MW_CHART_IMAGE:?Set the immutable chart-origin release image}
    ports: ["192.168.7.33:18083:80"]
    restart: unless-stopped
  backup:
    image: ${MW_BACKUP_IMAGE:?Set the immutable backup release image}
    env_file: .env
    environment:
      ALERTS_POSTGRES_BIN_DIR: /usr/local/bin
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_YAHOO_ENABLED: "true"
      ALERTS_DATABASE_JIT: ${MW_BACKUP_DATABASE_JIT:-${MW_PRODUCTION_DATABASE_JIT:-off}}
    volumes: ["/mnt/user/backup/market-watch:/backups"]
    profiles: [maintenance]
    restart: "no"
