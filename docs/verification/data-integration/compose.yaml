# Ubuntu local acceptance only; this project owns its database/network/volume.
name: market-watch-data-integration
x-backend: &backend
  build: ../../..
  image: market-watch-data-integration:dev
  restart: "no"
  mem_limit: 768m
  cpus: 2
  env_file:
    - path: ../../../artifacts/data-integration/runtime.env
      required: false
      format: raw
  environment: &environment
    ALERTS_DATABASE_URL: postgresql+psycopg://integration:${MW_DATA_TEST_PASSWORD:?Set isolated test password}@postgres/integration
    ALERTS_DELIVERY_ENABLED: "false"
    ALERTS_YAHOO_ENABLED: "false"
    ALERTS_INITIAL_HISTORY_DAYS: "0"
    ALERTS_DATABASE_APPLICATION_NAME: market-watch-data-integration
    ALERTS_COOKIE_SECURE: "false"
    ALERTS_PUBLIC_URL: http://127.0.0.1:16589
    ALERTS_DATABASE_POOL_SIZE: "3"
    ALERTS_DATABASE_MAX_OVERFLOW: "0"
  labels:
    market-watch.purpose: data-integration-acceptance
services:
  postgres:
    image: ${MW_DATA_POSTGRES_IMAGE:-postgres:14-bookworm}
    restart: "no"
    mem_limit: 768m
    environment:
      POSTGRES_DB: integration
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: ${MW_DATA_TEST_PASSWORD:?Set isolated test password}
    volumes: ["integration-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration"]
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      market-watch.purpose: data-integration-acceptance
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  verify:
    <<: *backend
    environment:
      <<: *environment
      TEST_POSTGRES_URL: postgresql+psycopg://integration:${MW_DATA_TEST_PASSWORD:?Set isolated test password}@postgres/integration
    command: ["python", "-m", "pytest", "backend/tests/test_market_contracts.py", "backend/tests/test_market_datasets.py", "backend/tests/test_market_datasets_postgres.py", "backend/tests/test_dukascopy_history.py", "backend/tests/test_history_versions.py", "backend/tests/test_history_derivation.py", "backend/tests/test_source_calendar.py", "backend/tests/test_source_history_postgres.py", "backend/tests/test_history_replay.py", "backend/tests/test_history_snapshots_migration.py", "backend/tests/test_history_replay_migration.py", "backend/tests/test_oanda_stream.py", "backend/tests/test_live_pricing.py", "backend/tests/test_live_pricing_postgres.py", "backend/tests/test_live_pricing_migration.py", "backend/tests/test_live_api.py", "-q", "-p", "no:cacheprovider"]
    profiles: [verify]
    depends_on:
      migrate: {condition: service_completed_successfully}
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  oanda-worker:
    <<: *backend
    restart: unless-stopped
    command: ["python", "-m", "alerts.oanda_worker"]
    depends_on:
      api: {condition: service_healthy}
  history-worker:
    <<: *backend
    restart: unless-stopped
    command: ["python", "-m", "alerts.history_versions"]
    depends_on:
      api: {condition: service_healthy}
  aggregation-worker:
    <<: *backend
    restart: unless-stopped
    command: ["python", "-m", "alerts.chart_aggregation_worker"]
    depends_on:
      api: {condition: service_healthy}
  web:
    build: ../../../web
    image: market-watch-data-integration-web:dev
    restart: unless-stopped
    mem_limit: 192m
    ports: ["127.0.0.1:16589:80"]
    labels:
      market-watch.purpose: data-integration-acceptance
    depends_on:
      api: {condition: service_healthy}
volumes:
  integration-postgres:
