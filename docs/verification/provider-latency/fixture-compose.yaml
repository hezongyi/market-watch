name: market-watch-provider-latency
x-service: &service
  restart: 'no'
  mem_limit: 512m
  cpus: 1
  labels:
    market-watch.purpose: provider-latency-isolated-verification
services:
  api:
    <<: *service
    image: market-watch-api:provider-latency-fix
    network_mode: host
    env_file:
      - path: /tmp/mw-provider-latency/api.env
        format: raw
    command: [uvicorn, 'alerts.api:app', --host, '127.0.0.1', --port, '18063']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18063/readyz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  web:
    <<: *service
    image: market-watch-web:provider-latency-fix
    network_mode: host
    volumes:
      - /tmp/mw-provider-latency/web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: {condition: service_healthy}
  chart-origin:
    <<: *service
    image: market-watch-chart-origin:1.3.0-local
    ports: ['127.0.0.1:15207:80']
  tls:
    <<: *service
    image: nginx:1.28-alpine
    network_mode: host
    volumes:
      - /tmp/mw-provider-latency/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - /tmp/mw-provider-latency/cert.pem:/certs/cert.pem:ro
      - /tmp/mw-provider-latency/key.pem:/certs/key.pem:ro
    depends_on: [web, chart-origin]
