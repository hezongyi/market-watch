# Isolated full-stack acceptance. No production resources or notification worker.
name: mw-viewport-acceptance
services:
  pg:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_DB: viewport
      POSTGRES_USER: viewport
      POSTGRES_PASSWORD: viewport-local
    volumes: ["viewport-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viewport"]
      interval: 2s
      retries: 30
  migrate:
    image: market-watch-api:viewport-acceptance
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: /tmp/mw-viewport-acceptance/api.env
        format: raw
    depends_on:
      pg: {condition: service_healthy}
  api:
    image: market-watch-api:viewport-acceptance
    env_file:
      - path: /tmp/mw-viewport-acceptance/api.env
        format: raw
    environment:
      ALERTS_DELIVERY_ENABLED: "false"
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 3s
      retries: 30
  web:
    image: market-watch-web:viewport-acceptance
    depends_on: [api]
  chart-origin:
    image: market-watch-chart-origin:viewport-acceptance
  tls:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:15743:443", "127.0.0.1:15744:444"]
    volumes:
      - /tmp/mw-viewport-acceptance/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - /tmp/mw-viewport-acceptance/cert.pem:/certs/cert.pem:ro
      - /tmp/mw-viewport-acceptance/key.pem:/certs/key.pem:ro
    depends_on: [web, chart-origin]
volumes:
  viewport-pg:
