name: mw-mcp-composite-indicators-20261023
x-logs: &logs
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
x-backend: &backend
  ALERTS_DATABASE_URL: postgresql+psycopg://composite:${MW_DB_PASSWORD:?private env required}@postgres/composite
  ALERTS_DATABASE_EXPECTED_VERSION: '140024'
  ALERTS_DATABASE_APPLICATION_NAME: mw-mcp-composite-indicators-20261023
  ALERTS_DATABASE_POOL_SIZE: '2'
  ALERTS_DATABASE_MAX_OVERFLOW: '0'
  ALERTS_MCP_ENABLED: 'true'
  ALERTS_MCP_ALLOWED_HOSTS: '["127.0.0.1","127.0.0.1:*","localhost","localhost:*"]'
  ALERTS_MCP_ALLOWED_ORIGINS: '["http://127.0.0.1","http://127.0.0.1:*","http://localhost","http://localhost:*"]'
  ALERTS_MCP_CALLS_PER_MINUTE: '600'
  ALERTS_PUBLIC_URL: http://127.0.0.1:${MW_PORT:-18623}
  ALERTS_ADMIN_PASSWORD_HASH: ${MW_ADMIN_HASH:?private env required}
  ALERTS_COOKIE_SECURE: 'false'
  ALERTS_DELIVERY_ENABLED: 'false'
  ALERTS_YAHOO_ENABLED: 'false'
  ALERTS_OANDA_STREAM_ENABLED: 'false'
  ALERTS_OANDA_ACCOUNT_ID: composite-test-account
  ALERTS_OANDA_TOKEN: ''
  ALERTS_INITIAL_HISTORY_DAYS: '0'
  ALERTS_HISTORY_HEALTH_WORKERS: '[]'
services:
  postgres:
    image: postgres:14.24-bookworm@sha256:993166bee3ea12e2baa70f47efe7ba4a191b3e92f44f9767eaefbb6194f53872
    mem_limit: 512m
    cpus: 0.3
    logging: *logs
    environment:
      POSTGRES_DB: composite
      POSTGRES_USER: composite
      POSTGRES_PASSWORD: ${MW_DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [isolated]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U composite -d composite && test \"$$(PGOPTIONS='-c jit=on' psql -U composite -d composite -Atqc \"SELECT current_setting('server_version_num') = '140024' AND pg_jit_available()\")\" = t"]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    image: ${MW_API_IMAGE:?task image ID required}
    profiles: [tools]
    mem_limit: 512m
    cpus: 0.3
    logging: *logs
    environment: *backend
    command: [alembic, upgrade, head]
    networks: [isolated]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    image: ${MW_API_IMAGE}
    mem_limit: 512m
    cpus: 0.3
    logging: *logs
    environment: *backend
    networks: [isolated]
    volumes:
      - ../../../backend/tests:/fixtures/tests:ro
      - ../../../scripts/verify_composite_indicators_mcp.py:/fixtures/verify.py:ro
      - ${MW_PRIVATE:?private path required}:/private
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 30
    depends_on:
      postgres: {condition: service_healthy}
  gateway:
    image: nginx:1.28-alpine@sha256:201aafcbd9cdd5385d5aaf610b45389944d8c2269c4a6f10e6fdf39f76cab592
    mem_limit: 64m
    cpus: 0.05
    logging: *logs
    volumes: [./gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: ['127.0.0.1:${MW_PORT:-18623}:80']
    networks: [isolated]
    depends_on:
      api: {condition: service_healthy}
networks:
  isolated:
    internal: true
volumes:
  postgres-data:
