# Ubuntu-only isolated database, network, volume and HTTPS ports.
name: mw-indicator-acceptance
services:
  pg:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: indicator_acceptance
      POSTGRES_USER: indicator_acceptance
      POSTGRES_PASSWORD: ${MW_INDICATOR_DB_PASSWORD:?Run prepare_indicator_acceptance.py}
    volumes: ["indicator-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indicator_acceptance"]
      interval: 2s
      retries: 30
  migrate:
    build: ../../..
    image: market-watch-api:indicator-acceptance
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: /tmp/mw-indicator-acceptance/api.env
        format: raw
    depends_on:
      pg: {condition: service_healthy}
  api:
    image: market-watch-api:indicator-acceptance
    env_file:
      - path: /tmp/mw-indicator-acceptance/api.env
        format: raw
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 3s
      retries: 30
  web:
    build:
      context: ../../../web
      args:
        VITE_ADVANCED_CHART_ORIGIN: https://localhost:18444
    image: market-watch-web:indicator-acceptance
    depends_on: [api]
  chart-origin:
    build: ../../../advanced-host
    image: market-watch-chart-origin:indicator-acceptance
  tls:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:18443:443", "127.0.0.1:18444:444"]
    volumes:
      - /tmp/mw-indicator-acceptance/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - /tmp/mw-indicator-acceptance/cert.pem:/certs/cert.pem:ro
      - /tmp/mw-indicator-acceptance/key.pem:/certs/key.pem:ro
    depends_on: [web, chart-origin]
volumes:
  indicator-pg:
