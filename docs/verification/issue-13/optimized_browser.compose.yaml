services:
  postgres:
    networks: [default, offline]
  api:
    image: ${ISSUE13_PROBE_IMAGE:?local immutable Python image}
    pull_policy: never
    user: "1000:1000"
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/backend
      ALERTS_DATABASE_URL: postgresql+psycopg://issue13:${ISSUE13_PG_PASSWORD}@postgres:5432/issue13
      ALERTS_FX_SOURCE: oanda
      ALERTS_COOKIE_SECURE: "true"
      ALERTS_DELIVERY_ENABLED: "false"
      ALERTS_INITIAL_HISTORY_DAYS: "0"
      ALERTS_PROVIDER_REQUEST_SECONDS: "2"
      ALERTS_ADMIN_PASSWORD_HASH: ${ISSUE13_BROWSER_PASSWORD_HASH:?private browser password hash}
    volumes:
      - ${ISSUE13_SOURCE:?frozen candidate source}:/workspace:ro
      - ${ISSUE13_RESULTS:?separate results directory}:/results
    networks: [offline]
    cpus: 0.45
    mem_limit: 768m
    command: [python, -m, uvicorn, alerts.api:app, --host, 0.0.0.0, --port, "8000", --log-level, warning]
    depends_on:
      postgres: {condition: service_healthy}
  publisher:
    init: true
    image: ${ISSUE13_PROBE_IMAGE:?local immutable Python image}
    pull_policy: never
    user: "1000:1000"
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/backend
      ALERTS_DATABASE_URL: postgresql+psycopg://issue13:${ISSUE13_PG_PASSWORD}@postgres:5432/issue13
      ALERTS_FX_SOURCE: oanda
    volumes:
      - ${ISSUE13_SOURCE:?frozen candidate source}:/workspace:ro
    networks: [offline]
    cpus: 0.45
    mem_limit: 768m
    command: [python, -m, alerts.chart_aggregation_worker]
    stop_grace_period: 60s
    depends_on:
      postgres: {condition: service_healthy}
  web:
    image: ${ISSUE13_WEB_IMAGE:?owned immutable built frontend image}
    pull_policy: never
    ports: ["192.168.7.232:19635:443"]
    volumes:
      - /tmp/mw-issue13-optimized-browser-private/web-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - /tmp/mw-issue13-optimized-browser-private/cert.pem:/certs/cert.pem:ro
      - /tmp/mw-issue13-optimized-browser-private/key.pem:/certs/key.pem:ro
    networks: [default, offline]
    cpus: 0.05
    mem_limit: 96m
    depends_on: [api]
  chart-origin:
    image: ${ISSUE13_CHART_IMAGE:?owned immutable built native chart image}
    pull_policy: never
    ports: ["192.168.7.232:19636:443"]
    volumes:
      - /tmp/mw-issue13-optimized-browser-private/chart-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - /tmp/mw-issue13-optimized-browser-private/cert.pem:/certs/cert.pem:ro
      - /tmp/mw-issue13-optimized-browser-private/key.pem:/certs/key.pem:ro
    cpus: 0.05
    mem_limit: 96m
  browser:
    profiles: [tools]
    image: ${ISSUE13_BROWSER_IMAGE:?task browser image with Chromium libraries}
    pull_policy: never
    user: "1000:1000"
    working_dir: /workspace
    environment:
      NODE_PATH: /modules
      PLAYWRIGHT_BROWSERS_PATH: /browsers
    volumes:
      - ${ISSUE13_SOURCE:?frozen candidate source}:/workspace:ro
      - ${ISSUE13_RESULTS:?separate results directory}:/results
      - /home/quant/repos/market-watch/web/node_modules:/modules:ro
      - /home/quant/.cache/ms-playwright:/browsers:ro
      - /tmp/mw-issue13-optimized-browser-private:/private:ro
    cpus: 0.45
    mem_limit: 1536m
    shm_size: 256m
    command: [node, docs/verification/issue-13/optimized_browser_probe.cjs]
networks:
  offline:
    internal: true
