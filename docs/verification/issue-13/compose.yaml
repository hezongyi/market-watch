services:
  postgres:
    image: ${ISSUE13_PG_IMAGE:?set existing immutable postgres image ID}
    pull_policy: never
    environment:
      POSTGRES_USER: issue13
      POSTGRES_DB: issue13
      POSTGRES_PASSWORD: ${ISSUE13_PG_PASSWORD:?set local password}
    ports:
      - "127.0.0.1:19613:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    cpus: 0.75
    mem_limit: 512m
    shm_size: 128m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "track_io_timing=on"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issue13 -d issue13"]
      interval: 2s
      timeout: 2s
      retries: 30
  probe:
    profiles: [tools]
    image: ${ISSUE13_PROBE_IMAGE:?set existing immutable Python application image ID}
    pull_policy: never
    user: "1000:1000"
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/backend
      ALERTS_DATABASE_URL: postgresql+psycopg://issue13:${ISSUE13_PG_PASSWORD}@postgres:5432/issue13
      ALERTS_FX_SOURCE: oanda
    volumes:
      - ../../..:/workspace:ro
      - ./results:/results
    cpus: 0.75
    mem_limit: 768m
    command: ["python", "docs/verification/issue-13/pg_baseline.py", "--help"]
volumes:
  pgdata:
