<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>系统消息入口 · 三版预览</title>
<style>
*{box-sizing:border-box}html{background:#101010;color:#dbdbdb;font:15px/1.65 system-ui}body{max-width:1240px;margin:24px auto;padding:0 20px 120px}h1{font-size:26px;margin:0 0 8px}h2{font-size:18px}p{color:#aaa}a{color:inherit}button{font:inherit;color:inherit;cursor:pointer;background:#242424;border:1px solid #444;border-radius:6px;padding:7px 13px}button:hover{background:#333}button:focus-visible,a:focus-visible{outline:2px solid #2962ff;outline-offset:4px}nav{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}nav a{border:1px solid #383838;padding:8px 18px;border-radius:6px;text-decoration:none}nav a[aria-current=page]{background:#eee;color:#161616;border-color:#eee}img{max-width:100%;height:auto;display:block}.design{width:100%;border-radius:10px}.stage{border:1px solid #333;border-radius:10px;overflow:hidden}.stage img{width:100%}.states{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.state{background:#181818;border:1px solid #303030;border-radius:8px;padding:18px;min-width:0}.state span{display:block;color:#aaa;font-size:13px;margin-bottom:12px}.state img{height:57px;width:auto;max-width:100%;object-fit:contain;object-position:left center}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:10px 14px;border:1px solid #555;border-radius:12px;background:#202020;box-shadow:0 8px 32px #0008;white-space:nowrap}.switcher strong{min-width:150px;text-align:center}details{margin-top:28px}summary{cursor:pointer}footer{font-size:13px;color:#999;margin-top:28px}@media(max-width:600px){.states{grid-template-columns:1fr}.switcher{gap:8px;max-width:calc(100% - 24px)}.switcher strong{min-width:130px}h1{font-size:22px}}
</style>
<h1>系统消息入口 · 三版预览</h1><p>沿用已确认的系统消息 SVG 图标。以下为独立浏览器中的真实专业图表工具栏截图，未修改验收页实际功能。</p>
<nav aria-label="选择预览方案"><a href="?variant=A" data-variant="A">A · 角标型</a><a href="?variant=B" data-variant="B">B · 并列计数</a><a href="?variant=C" data-variant="C">C · 文字标签</a></nav>
<img class="design" id="design" alt="所选系统消息入口设计图">
<h2>未读数量状态</h2><div class="states"><div class="state"><span>没有未读 · 隐藏数字</span><img id="zero" alt="无未读状态"></div><div class="state"><span>23 条未读</span><img id="count" alt="23 条未读状态"></div><div class="state"><span>超过 99 条 · 显示 99+</span><img id="many" alt="99+ 条未读状态"></div></div>
<h2>图表内完整位置</h2><a class="stage" id="full-link"><img id="full" alt="所选方案在完整专业图表中的位置"></a>
<details><summary>展开三版对比总图</summary><a href="comparison.png"><img src="comparison.png" alt="三版系统消息入口对比"></a></details>
<footer>数字仅统计系统消息未读，不含交易告警。每版入口宽度固定，数字变化不会挤动相邻控件。通知调度方案已确认，等待其余设计选定后统一实施。</footer>
<div class="switcher" aria-label="预览切换器"><button id="prev" aria-label="上一版">←</button><strong id="label"></strong><button id="next" aria-label="下一版">→</button></div>
<script>
const names={A:'角标型',B:'并列计数型',C:'文字标签型'},variants=Object.keys(names);
function render(v){if(!names[v])v='A';document.querySelector('#design').src='design-'+v+'.png';document.querySelector('#full').src='chart-'+v+'.png';document.querySelector('#full-link').href='chart-'+v+'.png';for(const [id,n]of[['zero',0],['count',23],['many',128]])document.querySelector('#'+id).src='entry-'+v+'-'+n+'.png';document.querySelector('#label').textContent=v+' · '+names[v];document.querySelectorAll('[data-variant]').forEach(a=>{if(a.dataset.variant===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.documentElement.dataset.variant=v;}
function change(v){const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);render(v)}
function cycle(d){const i=variants.indexOf(document.documentElement.dataset.variant);change(variants[(i+d+3)%3])}
document.querySelectorAll('[data-variant]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();change(a.dataset.variant)}));document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}});render(new URLSearchParams(location.search).get('variant')||'A');
</script></html>
