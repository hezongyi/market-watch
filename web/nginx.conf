resolver 127.0.0.11 valid=5s ipv6=off;
upstream market_watch_api {
    zone market_watch_api 64k;
    server api:8000 resolve;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location = /healthz { proxy_pass http://market_watch_api; }
    location = /readyz { proxy_pass http://market_watch_api; }
    location = /api { proxy_pass http://market_watch_api; }
    location ~ ^/mcp(?:/|$) {
        proxy_pass http://market_watch_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 65s;
    }
    location /api/ {
        proxy_pass http://market_watch_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # Retry failed connects promptly when an API process restarts. This
        # does not shorten the lifetime of an established SSE response.
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
    }
    location ~ ^/(?:assets/|charting_library_[a-f0-9]+/|chart\.[a-f0-9]+\.js$) { try_files $uri =404; }
    location = /chart-assets.json { add_header Cache-Control no-store; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
