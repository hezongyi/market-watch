name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      backend_changed: ${{ steps.changes.outputs.backend_changed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify change classification
        run: python -m unittest discover -s tests/ops -p test_ci_changes.py

      - name: Classify changed inputs
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: python .github/scripts/ci_changes.py --base "$BASE_SHA" --head "$HEAD_SHA" --event "$EVENT_NAME"

  backend_checks:
    name: Backend checks
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci
      CHART_ALERT_TEST_DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci
    services:
      postgres:
        image: postgres:14.24-bookworm
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Ubuntu tooling checks
        run: |
          python -m ruff check deploy/ubuntu/mw_docker.py deploy/ubuntu/mw_preview.py deploy/ubuntu/d1_seed.py tests/ops/test_preview.py .github/scripts/ci_changes.py tests/ops/test_ci_changes.py
          python -m pytest -q tests/ops

      - name: Verify PostgreSQL service version
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["TEST_POSTGRES_URL"])
          with engine.connect() as connection:
              version = connection.execute(text("SHOW server_version_num")).scalar_one()
          if version != "140024":
              raise SystemExit(f"expected PostgreSQL 14.24 (140024), got {version}")
          print(f"PostgreSQL server_version_num={version}")

      - name: Ruff changed Python files
        if: needs.changes.outputs.backend_changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            mapfile -t python_files < <(
              git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" |
                awk '/^backend\/.*\.py$/ { print }'
            )
          else
            mapfile -t python_files < <(
              git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" |
                awk '/^backend\/.*\.py$/ { print }'
            )
          fi

          if (( ${#python_files[@]} == 0 )); then
            echo "No changed backend Python files; skipping Ruff."
            exit 0
          fi

          printf 'Running Ruff on: %s\n' "${python_files[*]}"
          python -m ruff check "${python_files[@]}"

      - name: Python tests
        if: needs.changes.outputs.backend_changed == 'true'
        run: python -m pytest -q

      - name: Mapping PostgreSQL migration compatibility
        if: needs.changes.outputs.backend_changed == 'true'
        env:
          CHART_ALERT_TEST_DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
        run: python -m pytest -q backend/tests/test_composite_mapping_postgres.py

      - name: Observed indicator PostgreSQL policy compatibility
        run: python -m pytest -q backend/tests/test_observed_indicators_postgres.py

      - name: Backend checks skipped
        if: needs.changes.outputs.backend_changed != 'true'
        run: echo "No backend runtime or dependency changes; full backend tests skipped."

  web_checks:
    name: Web checks
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web application
        working-directory: web
        run: |
          npm ci
          npm run build:ui

      - name: Indicator runtime regressions
        working-directory: web
        run: |
          node tests/swing-fixed-identity.cjs
          node tests/squeeze-contract.cjs
          node tests/nr-breakout-display.cjs
          node tests/nr-breakout-restart.cjs
          node tests/indicator-high-rate.cjs
          node tests/indicator-high-rate.cjs --provider
          node tests/indicator-shared-read.cjs
          node tests/composite-display-batches.cjs
          node tests/indicator-display-snapshot.cjs
          node tests/indicator-snapshot-recovery.cjs
          node tests/display-recovery-lifecycle.cjs
          node tests/display-recovery-deferred.cjs
          node tests/snapshot-error-evidence.cjs
          node tests/provider-credential-recovery.cjs
          node tests/issue89-sampling.cjs
          node tests/issue89-native-lifecycle.cjs
          node tests/advanced-history-empty-failure.cjs
          node tests/advanced-capacity-boundary.cjs
          node tests/advanced-continuous-navigation.cjs
          node tests/advanced-refresh-range-cancellation.cjs
          node tests/advanced-refresh-failure.cjs
          node tests/advanced-refresh-interaction.cjs
          node tests/advanced-viewports.cjs

      - name: Chart runtime regressions
        working-directory: web
        run: |
          node tests/advanced-history-loading.cjs
          node tests/advanced-market-request-scheduling.cjs
          node tests/advanced-history-admission.cjs
          node tests/advanced-watchlist-quote-pressure.cjs
          node tests/advanced-quote-snapshot-sharing.cjs
          node tests/advanced-indicator-release-batches.cjs
          node tests/advanced-native-reserve-scheduler.cjs
          node tests/advanced-inflight-cancellation.cjs
          node tests/advanced-provider-request-lifetime.cjs
          node tests/preference-request-queue.cjs
          node tests/preference-draft-banner.cjs
          node tests/advanced-watchlist-prewarm.cjs
          node tests/advanced-watchlist-metadata.cjs
          node tests/advanced-startup-metadata.cjs
          node tests/resolve-recovery.cjs
          node tests/multi-chart-resolve-init.cjs
          node tests/api-read-recovery.cjs
          node --test tests/chart-alerts-bridge.test.cjs
          node tests/advanced-market-stream.cjs
          node tests/advanced-provider-subscriptions.cjs
          node tests/advanced-watchlists.cjs

      - name: Single application regressions
        working-directory: web
        run: |
          node tests/composite-mapping.cjs
          node tests/single-app-routing.cjs
          node tests/chart-tab.cjs
          node tests/chart-tab-title.cjs
          TZ=Asia/Shanghai node tests/chart-time.cjs
          TZ=America/Los_Angeles node tests/chart-time.cjs
          node tests/symbol-flags.cjs
          node tests/notifications-runtime.cjs
          node tests/notifications-persistence.cjs
          node tests/advanced-preferences.cjs
          node tests/advanced-preferences-conflict.cjs
          node tests/native-preference-notice.cjs
          node tests/market-notice-lifecycle.cjs
          node tests/provider-notice-lifecycle.cjs
          node tests/native-chunk-recovery.cjs

      - name: Watchlist native DOM regressions
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          node tests/advanced-watchlist-layout.browser.cjs
          node tests/advanced-watchlist-names.browser.cjs
          node tests/symbol-flags.browser.cjs
          node tests/system-history.browser.cjs
          node tests/alert-editing.browser.cjs
          node tests/squeeze-alert.browser.cjs
          node tests/alert-reference-ui.browser.cjs
          node tests/native-alert-price-lines.browser.cjs
          node --test tests/alert-price-edit.test.cjs
          node tests/alert-price-drag.browser.cjs
          node tests/notice-page-exit.browser.cjs
          npm run test:single-frontend -- --unit

  compose_checks:
    name: Compose checks
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci-only-placeholder
      MW_API_IMAGE: market-watch-api:ci
      MW_WEB_IMAGE: market-watch-web:ci
      MW_BACKUP_IMAGE: market-watch-backup:ci
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose definitions
        run: |
          set -euo pipefail
          trap 'rm -f .env' EXIT

          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-only-placeholder
          MW_API_IMAGE=market-watch-api:ci
          MW_WEB_IMAGE=market-watch-web:ci
          MW_BACKUP_IMAGE=market-watch-backup:ci
          MW_PRODUCTION_DATABASE_JIT=off
          EOF

          docker compose -f compose.yaml config --quiet
          docker compose -f compose.production.yaml config --quiet

          acceptance_dir="$RUNNER_TEMP/market-watch-acceptance"
          mkdir -p "$acceptance_dir"
          printf '%s\n' 'ALERTS_DELIVERY_ENABLED=false' > "$acceptance_dir/api.env"
          touch "$acceptance_dir/tls.conf" "$acceptance_dir/cert.pem" "$acceptance_dir/key.pem"

          MW_ACCEPTANCE_ENV="$acceptance_dir/api.env" \
          MW_ACCEPTANCE_DIR="$acceptance_dir" \
            docker compose -f compose.acceptance.yaml config --quiet

          MW_ACCEPTANCE_DB_PASSWORD=ci-only-placeholder \
          MW_ADMIN_PASSWORD_HASH=ci-only-placeholder \
          MW_ACCEPTANCE_PRIVATE="$acceptance_dir" \
            docker compose -f deploy/ubuntu/single-app.acceptance.yaml config --quiet

          cp "$acceptance_dir/api.env" "$acceptance_dir/backend.env"
          cp "$acceptance_dir/api.env" "$acceptance_dir/verify.env"
          MW_DATABASE_PASSWORD=ci-only-placeholder \
          MW_PRIVATE_DIR="$acceptance_dir" MW_REPO="$GITHUB_WORKSPACE" \
            docker compose -f deploy/ubuntu/single-frontend.acceptance.yaml config --quiet

  required:
    # Keep the protected contexts, including when heavy jobs are skipped.
    # always() also reports failure if classification failed or a job was cancelled.
    name: ${{ matrix.check }}
    needs: [changes, backend_checks, web_checks, compose_checks]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        check: [backend, web, compose]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report required check
        env:
          CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHECK_RESULT: ${{ needs[format('{0}_checks', matrix.check)].result }}
        run: bash .github/scripts/ci_required.sh
