name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/ci
    services:
      postgres:
        image: postgres:14.24-bookworm
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Ubuntu tooling checks
        run: |
          python -m ruff check deploy/ubuntu/mw_docker.py deploy/ubuntu/mw_preview.py deploy/ubuntu/d1_seed.py tests/ops/test_preview.py
          python -m pytest -q tests/ops

      - name: Detect backend test changes
        id: backend_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$HEAD_SHA")"
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(backend/|migrations/|pyproject\.toml$|requirements\.lock$|alembic\.ini$|Dockerfile$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Backend test inputs changed; full backend checks will run."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No backend test inputs changed; full backend checks will be skipped."
          fi

      - name: Verify PostgreSQL service version
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["TEST_POSTGRES_URL"])
          with engine.connect() as connection:
              version = connection.execute(text("SHOW server_version_num")).scalar_one()
          if version != "140024":
              raise SystemExit(f"expected PostgreSQL 14.24 (140024), got {version}")
          print(f"PostgreSQL server_version_num={version}")

      - name: Ruff changed Python files
        if: steps.backend_changes.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            mapfile -t python_files < <(
              git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" |
                awk '/^backend\/.*\.py$/ { print }'
            )
          else
            mapfile -t python_files < <(
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
                awk '/^backend\/.*\.py$/ { print }'
            )
          fi

          if (( ${#python_files[@]} == 0 )); then
            echo "No changed backend Python files; skipping Ruff."
            exit 0
          fi

          printf 'Running Ruff on: %s\n' "${python_files[*]}"
          python -m ruff check "${python_files[@]}"

      - name: Python tests
        if: steps.backend_changes.outputs.changed == 'true'
        run: python -m pytest -q

      - name: Backend checks skipped
        if: steps.backend_changes.outputs.changed != 'true'
        run: echo "Backend checks are not needed for this change set."

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web application
        working-directory: web
        run: |
          npm ci
          npm run build

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci-only-placeholder
      MW_API_IMAGE: market-watch-api:ci
      MW_WEB_IMAGE: market-watch-web:ci
      MW_CHART_IMAGE: market-watch-chart-origin:ci
      MW_BACKUP_IMAGE: market-watch-backup:ci
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose definitions
        run: |
          set -euo pipefail
          trap 'rm -f .env' EXIT

          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-only-placeholder
          MW_API_IMAGE=market-watch-api:ci
          MW_WEB_IMAGE=market-watch-web:ci
          MW_CHART_IMAGE=market-watch-chart-origin:ci
          MW_BACKUP_IMAGE=market-watch-backup:ci
          MW_PRODUCTION_DATABASE_JIT=off
          EOF

          docker compose -f compose.yaml config --quiet
          docker compose -f compose.production.yaml config --quiet

          acceptance_dir="$RUNNER_TEMP/market-watch-acceptance"
          mkdir -p "$acceptance_dir"
          printf '%s\n' 'ALERTS_DELIVERY_ENABLED=false' > "$acceptance_dir/api.env"
          touch "$acceptance_dir/tls.conf" "$acceptance_dir/cert.pem" "$acceptance_dir/key.pem"

          MW_ACCEPTANCE_ENV="$acceptance_dir/api.env" \
          MW_ACCEPTANCE_DIR="$acceptance_dir" \
            docker compose -f compose.acceptance.yaml config --quiet
