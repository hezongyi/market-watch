name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Ruff
        run: python -m ruff check backend

      - name: Python tests
        run: python -m pytest -q

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web application
        working-directory: web
        run: |
          npm ci
          npm run build

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci-only-placeholder
      MW_API_IMAGE: market-watch-api:ci
      MW_WEB_IMAGE: market-watch-web:ci
      MW_CHART_IMAGE: market-watch-chart-origin:ci
      MW_BACKUP_IMAGE: market-watch-backup:ci
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose definitions
        run: |
          set -euo pipefail
          trap 'rm -f .env' EXIT

          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-only-placeholder
          MW_API_IMAGE=market-watch-api:ci
          MW_WEB_IMAGE=market-watch-web:ci
          MW_CHART_IMAGE=market-watch-chart-origin:ci
          MW_BACKUP_IMAGE=market-watch-backup:ci
          MW_PRODUCTION_DATABASE_JIT=off
          EOF

          docker compose -f compose.yaml config --quiet
          docker compose -f compose.production.yaml config --quiet

          acceptance_dir="$RUNNER_TEMP/market-watch-acceptance"
          mkdir -p "$acceptance_dir"
          printf '%s\n' 'ALERTS_DELIVERY_ENABLED=false' > "$acceptance_dir/api.env"
          touch "$acceptance_dir/tls.conf" "$acceptance_dir/cert.pem" "$acceptance_dir/key.pem"

          MW_ACCEPTANCE_ENV="$acceptance_dir/api.env" \
          MW_ACCEPTANCE_DIR="$acceptance_dir" \
            docker compose -f compose.acceptance.yaml config --quiet
