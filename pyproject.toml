[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-watch"
version = "1.13.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1", "argon2-cffi>=23,<26", "alembic>=1.14,<2",
  "mcp==2.3.0", "TA-Lib==0.6.8", "numpy==2.4.6", "yfinance==1.7.0",
]

[project.optional-dependencies]
calendar = ["pandas_market_calendars==5.4.0"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
